name: Publish to ComfyUI Registry

# Publishes whenever pyproject.toml changes on main (bump `version` to release).
# One-time setup: create a publisher at https://registry.comfy.org, set
# `PublisherId` in pyproject.toml, and add a REGISTRY_ACCESS_TOKEN repository secret.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  issues: write

jobs:
  publish-node:
    name: Publish custom node
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'karailker' }}
    steps:
      - uses: actions/checkout@v4
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
